name: PhoneCloud tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  platform:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm test
      - run: bash -n install.sh && bash -n scripts/phonecloud.sh
        if: runner.os == 'Linux'
